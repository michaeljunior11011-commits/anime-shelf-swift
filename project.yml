name: AnimeShelf
developmentLanguage: ar
options:
  bundleIdPrefix: com.multimedia
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  AnimeShelf:
    type: application
    platform: iOS
    sources:
      - path: AnimeShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multimedia.AnimeShelf
        PRODUCT_NAME: AnimeShelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anime Shelf
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AnimeShelfTests
  AnimeShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnimeShelfTests
    dependencies:
      - target: AnimeShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.multimedia.AnimeShelfTests
        GENERATE_INFOPLIST_FILE: YES
