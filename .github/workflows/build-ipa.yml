name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project AnimeShelf.xcodeproj \
            -scheme AnimeShelf \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnimeShelf.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AnimeShelf-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-unsigned
          path: AnimeShelf-unsigned.ipa

      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AnimeShelf-unsigned.ipa \
            --title "Anime Shelf build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned iOS IPA. Sign it with your Apple ID using AltStore or Sideloadly before installing." \
            --latest
