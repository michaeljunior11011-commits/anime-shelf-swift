name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          ')
          xcodebuild \
            -project AnimeShelf.xcodeproj \
            -scheme AnimeShelf \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            test

      - name: Capture simulator smoke screenshot
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          ')
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          sleep 6
          xcodebuild \
            -project AnimeShelf.xcodeproj \
            -scheme AnimeShelf \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build-simulator \
            build
          xcrun simctl install "$SIMULATOR_ID" build-simulator/Build/Products/Debug-iphonesimulator/AnimeShelf.app
          xcrun simctl launch "$SIMULATOR_ID" com.multimedia.AnimeShelf
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_ID" screenshot screenshots/home.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-simulator-screenshot
          path: screenshots/home.png

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project AnimeShelf.xcodeproj \
            -scheme AnimeShelf \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnimeShelf.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AnimeShelf-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-unsigned
          path: AnimeShelf-unsigned.ipa

      - name: Create downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AnimeShelf-unsigned.ipa \
            --title "Anime Shelf build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned iOS IPA. Sign it with your Apple ID using AltStore or Sideloadly before installing." \
            --latest
