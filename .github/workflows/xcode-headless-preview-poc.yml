name: Xcode Preview POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-preview:
    name: Render SwiftUI preview through Xcode MCP
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Xcode runner
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xcode-preview-output"
          mkdir -p "$output"

          {
            echo "# Runner diagnostics"
            echo
            echo '```text'
            sw_vers
            echo
            xcode-select -p
            xcodebuild -version
            echo
            xcrun --find mcpbridge
            xcrun --find mcp-server || true
            echo '```'
          } | tee "$output/runner-diagnostics.md" >> "$GITHUB_STEP_SUMMARY"

          if xcrun --find mcp-server >/dev/null 2>&1; then
            echo "mode=headless" >> "$GITHUB_OUTPUT"
          else
            echo "mode=xcode" >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          npm ci --prefix .github/xcode-headless-preview

      - name: Create temporary SwiftUI project
        shell: bash
        run: |
          set -euo pipefail
          project_root="$RUNNER_TEMP/PreviewLab"
          cp -R .github/xcode-headless-preview/fixture "$project_root"
          (cd "$project_root" && xcodegen generate)
          echo "PREVIEW_PROJECT_PATH=$project_root/PreviewLab.xcodeproj" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_PATH=$project_root/PreviewLab/TestView.swift" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_FILE=PreviewLab/TestView.swift" >> "$GITHUB_ENV"

      - name: Start Xcode 27 beta 5 headless server
        if: steps.inspect.outputs.mode == 'headless'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcrun mcp-server enable --unsafe-always-allow-all-agents
          xcrun mcp-server start
          xcrun mcp-server status | tee -a "$RUNNER_TEMP/xcode-preview-output/runner-diagnostics.md"
          echo "XCODE_MCP_MODE=headless" >> "$GITHUB_ENV"

      - name: Start Xcode 27 beta 4 in the background
        if: steps.inspect.outputs.mode == 'xcode'
        shell: bash
        run: |
          set -euo pipefail
          defaults write com.apple.dt.Xcode IDEAllowUnauthenticatedAgents -bool YES
          xcode_app="$(dirname "$(dirname "$(xcode-select -p)")")"
          open -a "$xcode_app" "$PREVIEW_PROJECT_PATH"

          xcode_pid=""
          for _ in {1..30}; do
            xcode_pid="$(pgrep -x Xcode | head -1 || true)"
            [[ -n "$xcode_pid" ]] && break
            sleep 1
          done
          [[ -n "$xcode_pid" ]] || { echo "Xcode did not start."; exit 1; }

          echo "MCP_XCODE_PID=$xcode_pid" >> "$GITHUB_ENV"
          echo "XCODE_MCP_MODE=xcode" >> "$GITHUB_ENV"
          {
            echo
            echo "Xcode PID: $xcode_pid"
            ps -p "$xcode_pid" -o pid=,comm=
            defaults read com.apple.dt.Xcode IDEAllowUnauthenticatedAgents || true
          } | tee -a "$RUNNER_TEMP/xcode-preview-output/runner-diagnostics.md"

      - name: List tools and render A then B
        working-directory: .github/xcode-headless-preview
        run: node run-poc.mjs "$RUNNER_TEMP/xcode-preview-output"

      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/xcode-preview-output/report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics and preview PNG files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-preview-proof
          path: ${{ runner.temp }}/xcode-preview-output
          if-no-files-found: error
          retention-days: 7

      - name: Stop Xcode MCP processes
        if: always()
        shell: bash
        run: |
          xcrun mcp-server stop 2>/dev/null || true
          pkill -x Xcode 2>/dev/null || true
