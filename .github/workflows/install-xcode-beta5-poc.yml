name: Install Xcode 27 Beta 5 and Preview

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Preview test to run after Xcode is ready
        required: true
        default: proof
        type: choice
        options:
          - proof
          - warm-benchmark
          - new-file-benchmark

permissions:
  actions: write
  contents: read

jobs:
  install-and-render:
    name: Download Beta 5 and render SwiftUI preview
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      XCODES_USERNAME: ${{ secrets.APPLE_ID }}
      XCODES_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      OTP_GITHUB_TOKEN: ${{ secrets.OTP_MAILBOX_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect runner and available space
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xcode-beta5-output"
          mkdir -p "$output"

          {
            echo "# Xcode 27 Beta 5 installation proof"
            echo
            echo '```text'
            sw_vers
            xcodebuild -version
            xcodes version
            df -h / "$RUNNER_TEMP"
            echo '```'
          } | tee "$output/runner-diagnostics.md" >> "$GITHUB_STEP_SUMMARY"

          if xcrun --find mcp-server >/dev/null 2>&1; then
            echo "needs_install=false" >> "$GITHUB_OUTPUT"
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          else
            echo "needs_install=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Xcode 27 Beta 5 from private release
        id: release_install
        if: steps.inspect.outputs.needs_install == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xcode-beta5-output"
          install_root="$RUNNER_TEMP/XcodeBeta5"
          xip="$RUNNER_TEMP/Xcode_27_beta_5.xip"
          mkdir -p "$install_root"

          gh release download xcode-27-beta5-cache \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Xcode_27_beta_5.xip' \
            --dir "$RUNNER_TEMP"

          echo '1f92c0fbb7268205e9b1f8061bf47db012a92e47729557c79ac053c9e5bd881a  '"$xip" | shasum -a 256 --check
          xcodes install "27.0 Beta 5" \
            --path "$xip" \
            --directory "$install_root" \
            --experimental-unxip 2>&1 | tee "$output/private-release-install.log"

          xcode_app="$(find "$install_root" -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$xcode_app" ]] || { echo 'No Xcode app was produced from the private release asset.'; exit 1; }
          developer_dir="$xcode_app/Contents/Developer"
          sudo xcode-select --switch "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "BETA5_XCODE_APP=$xcode_app" >> "$GITHUB_ENV"
          xcodebuild -version | tee -a "$output/runner-diagnostics.md"
          xcrun mcp-server --help > "$output/mcp-server-help.txt" 2>&1

      - name: Verify Apple secrets are configured
        if: steps.inspect.outputs.needs_install == 'true' && steps.release_install.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$XCODES_USERNAME" || -z "$XCODES_PASSWORD" ]]; then
            echo "APPLE_ID and APPLE_ID_PASSWORD must be configured as GitHub Actions secrets." \
              | tee -a "$RUNNER_TEMP/xcode-beta5-output/report.md" "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::add-mask::$XCODES_USERNAME"
          echo "::add-mask::$XCODES_PASSWORD"

      - name: Verify temporary 2FA mailbox access
        if: steps.inspect.outputs.needs_install == 'true' && steps.release_install.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.OTP_MAILBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh variable set APPLE_2FA_CODE --body "MAILBOX_TEST" --repo "$GITHUB_REPOSITORY"
          value="$(gh variable get APPLE_2FA_CODE --repo "$GITHUB_REPOSITORY")"
          gh variable delete APPLE_2FA_CODE --repo "$GITHUB_REPOSITORY"
          [[ "$value" == "MAILBOX_TEST" ]] || { echo "Repository variable mailbox verification failed."; exit 1; }

      - name: Download and install Xcode 27 Beta 5
        id: install
        if: steps.inspect.outputs.needs_install == 'true' && steps.release_install.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xcode-beta5-output"
          install_root="$RUNNER_TEMP/XcodeBeta5"
          mkdir -p "$install_root"
          current_log="$output/xcodes-current.log"
          fallback_log="$output/xcodes-1.6.2.log"

          python3 -m venv "$RUNNER_TEMP/otp-venv"
          "$RUNNER_TEMP/otp-venv/bin/python" -m pip install --quiet --disable-pip-version-check pexpect
          xcodes update 2>&1 | tee "$output/xcodes-update.log"
          xcodes list 2>&1 | tee "$output/xcodes-list.log"
          if ! grep -Eiq '27(\.0){0,2}[[:space:]]+Beta[[:space:]]+5' "$output/xcodes-list.log"; then
            echo "Xcode 27 Beta 5 was not present in the xcodes catalog." \
              | tee "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
            exit 10
          fi

          install_status=1
          for network_attempt in 1 2 3; do
            set +e
            "$RUNNER_TEMP/otp-venv/bin/python" .github/xcode-headless-preview/install-with-2fa.py \
              "$current_log" \
              "$(command -v xcodes)" install "27.0 Beta 5" \
              --directory "$install_root" \
              --experimental-unxip
            install_status=$?
            set -e

            if [[ $install_status -eq 0 ]]; then
              break
            fi

            if grep -Eiq 'NetworkError|AsyncNetworkService|statusCode:[[:space:]]*5[0-9]{2}|non200StatusCode\(statusCode:[[:space:]]*5[0-9]{2}' "$current_log"; then
              if [[ $network_attempt -lt 3 ]]; then
                delay=$((network_attempt * 10))
                echo "Apple download service returned a transient error; retrying inside this runner in ${delay}s (attempt $((network_attempt + 1))/3)."
                sleep "$delay"
                continue
              fi
            fi
            break
          done

          if [[ $install_status -ne 0 ]]; then
            if [[ $install_status -eq 90 ]]; then
              echo "The temporary 2FA mailbox timed out or could not access the repository variable." \
                | tee "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
              exit 20
            fi

            if grep -Eiq '403|Unauthorized|authentication|two-factor' "$current_log"; then
              echo "Current xcodes authentication failed; trying the documented 1.6.2 fallback." \
                | tee -a "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
              fallback_archive="$RUNNER_TEMP/xcodes-1.6.2.tar.gz"
              fallback_root="$RUNNER_TEMP/xcodes-1.6.2"
              curl --fail --location --silent --show-error \
                'https://github.com/XcodesOrg/xcodes/releases/download/1.6.2/xcodes-1.6.2.macos.arm64.tar.gz' \
                --output "$fallback_archive"
              mkdir -p "$fallback_root"
              tar -xzf "$fallback_archive" -C "$fallback_root"
              fallback_bin="$fallback_root/xcodes/1.6.2/bin/xcodes"
              "$fallback_bin" version | tee -a "$fallback_log"

              set +e
              "$RUNNER_TEMP/otp-venv/bin/python" .github/xcode-headless-preview/install-with-2fa.py \
                "$fallback_log" \
                "$fallback_bin" install "27.0 Beta 5" \
                --directory "$install_root" \
                --experimental-unxip
              fallback_status=$?
              set -e

              if [[ $fallback_status -ne 0 ]]; then
                echo "xcodes 1.6.2 could not install Xcode Beta 5. See the uploaded fallback log." \
                  | tee -a "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
                exit 21
              fi
            else
              echo "xcodes failed before installation for a non-authentication reason. See the uploaded log." \
                | tee "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
              exit "$install_status"
            fi
          fi

          xcode_app="$(find "$install_root" -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$xcode_app" ]]; then
            echo "The download command completed, but no Xcode app was found in the installation directory." \
              | tee "$output/report.md" >> "$GITHUB_STEP_SUMMARY"
            exit 30
          fi

          developer_dir="$xcode_app/Contents/Developer"
          sudo xcode-select --switch "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "BETA5_XCODE_APP=$xcode_app" >> "$GITHUB_ENV"
          xcodebuild -version | tee -a "$output/runner-diagnostics.md"
          xcrun mcp-server --help > "$output/mcp-server-help.txt" 2>&1

      - name: Require successful Beta 5 installation
        if: steps.inspect.outputs.needs_install == 'true' && steps.release_install.outcome != 'success' && steps.install.outcome != 'success'
        run: |
          echo "Xcode 27 Beta 5 was not installed, so RenderPreview was not started."
          exit 1

      - name: Prepare temporary SwiftUI preview project
        if: steps.inspect.outputs.needs_install == 'false' || steps.release_install.outcome == 'success' || steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          npm ci --prefix .github/xcode-headless-preview
          project_root="$RUNNER_TEMP/PreviewLab"
          cp -R .github/xcode-headless-preview/fixture "$project_root"
          (cd "$project_root" && xcodegen generate)
          echo "PREVIEW_PROJECT_PATH=$project_root/PreviewLab.xcodeproj" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_PATH=$project_root/PreviewLab/TestView.swift" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_FILE=PreviewLab/TestView.swift" >> "$GITHUB_ENV"
          echo "XCODE_MCP_MODE=headless" >> "$GITHUB_ENV"

      - name: Start headless Xcode MCP server
        if: steps.inspect.outputs.needs_install == 'false' || steps.release_install.outcome == 'success' || steps.install.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcrun mcp-server enable --unsafe-always-allow-all-agents
          xcrun mcp-server start
          xcrun mcp-server status | tee -a "$RUNNER_TEMP/xcode-beta5-output/runner-diagnostics.md"

      - name: Render A then B
        if: (steps.inspect.outputs.needs_install == 'false' || steps.release_install.outcome == 'success' || steps.install.outcome == 'success') && inputs.test_mode == 'proof'
        working-directory: .github/xcode-headless-preview
        run: node run-poc.mjs "$RUNNER_TEMP/xcode-beta5-output"

      - name: Run warm RenderPreview benchmark
        if: (steps.inspect.outputs.needs_install == 'false' || steps.release_install.outcome == 'success' || steps.install.outcome == 'success') && inputs.test_mode == 'warm-benchmark'
        working-directory: .github/xcode-headless-preview
        run: node run-warm-benchmark.mjs "$RUNNER_TEMP/xcode-beta5-output"

      - name: Test live creation of Swift2000.swift
        if: (steps.inspect.outputs.needs_install == 'false' || steps.release_install.outcome == 'success' || steps.install.outcome == 'success') && inputs.test_mode == 'new-file-benchmark'
        working-directory: .github/xcode-headless-preview
        env:
          BENCHMARK_SCOPE: new-file-only
        run: node run-warm-benchmark.mjs "$RUNNER_TEMP/xcode-beta5-output"

      - name: Publish preview report
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/xcode-beta5-output/report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          benchmark="$RUNNER_TEMP/xcode-beta5-output/warm-benchmark.md"
          if [[ -f "$benchmark" ]]; then
            cat "$benchmark" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload installation logs and preview proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-beta5-${{ inputs.test_mode }}-results
          path: ${{ runner.temp }}/xcode-beta5-output
          if-no-files-found: error
          retention-days: 3

      - name: Stop Xcode MCP server
        if: always()
        run: xcrun mcp-server stop 2>/dev/null || true
