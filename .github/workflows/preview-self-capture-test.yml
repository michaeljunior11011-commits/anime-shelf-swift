name: Xcode Preview Runtime Self Capture Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  self-capture-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27 Beta 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --find mcp-server >/dev/null 2>&1; then
            xip="$RUNNER_TEMP/Xcode_27_beta_5.xip"
            root="$RUNNER_TEMP/XcodeBeta5"
            mkdir -p "$root"
            gh release download xcode-27-beta5-private-cache \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'Xcode_27_beta_5.xip' \
              --dir "$RUNNER_TEMP"
            echo '1f92c0fbb7268205e9b1f8061bf47db012a92e47729557c79ac053c9e5bd881a  '"$xip" | shasum -a 256 --check
            xcodes install "27.0 Beta 5" --path "$xip" --directory "$root" --experimental-unxip
            app="$(find "$root" -maxdepth 3 -type d -name '*.app' -print -quit)"
            [[ -n "$app" ]] || exit 1
            sudo xcode-select --switch "$app/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Prepare one headless Preview session
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          npm ci --prefix .github/xcode-headless-preview
          project="$GITHUB_WORKSPACE/.github/xcode-headless-preview/fixture"
          (cd "$project" && xcodegen generate)
          echo "PREVIEW_PROJECT_PATH=$project/PreviewLab.xcodeproj" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_PATH=$project/PreviewLab/TestView.swift" >> "$GITHUB_ENV"
          echo "PREVIEW_SOURCE_FILE=PreviewLab/TestView.swift" >> "$GITHUB_ENV"
          sudo xcrun mcp-server enable --unsafe-always-allow-all-agents
          xcrun mcp-server start
          sleep 30

      - name: Enumerate Preview IO and test internal self-capture
        shell: bash
        run: |
          node .github/xcode-headless-preview/test-preview-self-capture.mjs \
            "$RUNNER_TEMP/preview-self-capture-output"

      - name: Upload the complete experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-self-capture-test
          path: ${{ runner.temp }}/preview-self-capture-output
          retention-days: 3

      - name: Stop the headless server
        if: always()
        shell: bash
        run: xcrun mcp-server stop 2>/dev/null || true
