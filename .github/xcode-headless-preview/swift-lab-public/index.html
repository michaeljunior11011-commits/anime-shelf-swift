<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Swift Lab</title>
  <style>
    :root{--ink:#e8eef7;--muted:#8b9ab0;--line:#253143;--panel:#10161f;--canvas:#080b10;--cyan:#63dbff;--green:#67e3a1;--red:#ff8195}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,#18314c 0,transparent 31%),var(--canvas);color:var(--ink);font-family:Georgia,"Times New Roman",serif}header{height:62px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);background:#0c1119e8;backdrop-filter:blur(16px)}h1{font-size:18px;letter-spacing:.06em;margin:0}.connected{font:11px ui-monospace,monospace;color:var(--green)}.connected::before{content:"●";margin-right:7px}main{display:grid;grid-template-columns:190px minmax(360px,1fr) minmax(330px,.88fr);min-height:calc(100vh - 62px)}aside,.editor{border-right:1px solid var(--line)}.side-title{padding:17px 15px 10px;color:var(--muted);font:700 10px ui-monospace,monospace;letter-spacing:.16em}.page{width:100%;border:0;border-left:2px solid transparent;background:transparent;color:#b8c5d6;text-align:left;padding:11px 14px;cursor:pointer;font:13px ui-monospace,monospace}.page:hover,.page.active{background:#162233;color:#fff}.page.active{border-left-color:var(--cyan)}.editor{display:flex;flex-direction:column;background:#0d121a}.bar{height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid var(--line);color:#bac8d9;font:12px ui-monospace,monospace}.bar span:last-child{color:var(--muted);font-size:10px}textarea{flex:1;min-height:420px;resize:none;border:0;outline:0;padding:20px;background:transparent;color:#e5edf8;font:14px/1.75 "Cascadia Code",Consolas,monospace;tab-size:4;direction:ltr;text-align:left}.status{min-height:42px;padding:11px 15px;border-top:1px solid var(--line);font:12px ui-monospace,monospace;color:var(--muted)}.status.busy{color:var(--cyan)}.status.error{color:var(--red);white-space:pre-wrap}.preview{display:flex;flex-direction:column;align-items:center;padding:22px;background:linear-gradient(145deg,#111a27,#080b10)}.preview-top{width:100%;display:flex;justify-content:space-between;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.08em}.xcode-output{margin:auto;display:flex;justify-content:center;align-items:center;max-width:100%;max-height:75vh}.xcode-output img{display:block;max-width:100%;max-height:75vh;object-fit:contain}.empty{max-width:250px;text-align:center;color:var(--muted);font:14px/1.8 Georgia,serif}button{font:inherit}@media(max-width:900px){main{grid-template-columns:135px 1fr}.preview{position:fixed;inset:82px 16px 16px 150px;display:none;border:1px solid var(--line)}.preview.show{display:flex}#toggle{display:inline-block}}@media(min-width:901px){#toggle{display:none}}
  </style>
</head>
<body>
  <header><h1>SWIFT LAB</h1><div><button id="toggle">Preview</button><span class="connected">XCODE CONNECTED</span></div></header>
  <main>
    <aside><div class="side-title">XCODE PAGES</div><div id="pages"></div></aside>
    <section class="editor"><div class="bar"><span id="name">—</span><span>AUTOSAVE · 500ms</span></div><textarea id="code" spellcheck="false"></textarea><div id="status" class="status">Loading…</div></section>
    <section id="preview" class="preview"><div class="preview-top"><span>RAW XCODE RENDERPREVIEW</span><span id="speed">—</span></div><div class="xcode-output"><div id="empty" class="empty">Choose a page. The image shown here is the original PNG returned by Xcode.</div><img id="image" alt="Original Xcode RenderPreview output" hidden></div></section>
  </main>
  <script>
    const base=location.pathname.replace(/\/$/,"");let active="",timer=0,requestId=0;
    const $=id=>document.getElementById(id),code=$("code"),status=$("status"),image=$("image");
    async function api(route,options){const r=await fetch(base+route,options);const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");return data}
    async function loadState(preferred){image.removeAttribute("src");image.hidden=true;$("empty").hidden=false;const state=await api("/api/state"),pages=state.pages||[];$("pages").innerHTML="";for(const page of pages){const b=document.createElement("button");b.className="page";b.textContent=page.label;b.title=page.source;b.onclick=()=>openPage(page.id);$("pages").append(b)}if(pages.length){await openPage(preferred&&pages.some(p=>p.id===preferred)?preferred:pages[0].id);await render()}}
    async function openPage(id){active=id;const f=await api("/api/file?id="+encodeURIComponent(id));code.value=f.content;$("name").textContent=f.source;document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.textContent===f.label));status.className="status";status.textContent="Ready"}
    async function render(){if(!active)return;const id=++requestId;status.className="status busy";status.textContent="Xcode is rendering…";try{const queued=await api("/api/render",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:active,content:code.value})});let result;for(let i=0;i<300;i++){await new Promise(r=>setTimeout(r,1000));result=await api("/api/render/"+queued.jobId);if(result.status==="complete")break;if(result.status==="error")throw new Error(result.error)}if(result?.status!=="complete")throw new Error("Xcode Preview timed out");if(id!==requestId)return;image.src=base+"/preview.png?v="+result.version;image.hidden=false;$("empty").hidden=true;$("speed").textContent=(result.elapsedMs/1000).toFixed(1)+"s";status.className="status";status.textContent="Original Xcode PNG updated"}catch(e){if(id!==requestId)return;status.className="status error";status.textContent=e.message}}
    code.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(render,500)});code.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=code.selectionStart;code.setRangeText("    ",s,code.selectionEnd,"end")}});$("toggle").onclick=()=>$("preview").classList.toggle("show");loadState().catch(e=>{status.className="status error";status.textContent=e.message});
  </script>
</body>
</html>
