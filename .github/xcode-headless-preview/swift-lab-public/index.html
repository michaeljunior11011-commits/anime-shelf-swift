<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Swift Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#273042;--text:#f3f6fb;--muted:#8e9bb0;--cyan:#52d9ff;--green:#66e3a4;--red:#ff7a90}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#14243a 0,transparent 35%),var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","Segoe UI",sans-serif;height:100vh;overflow:hidden}
    header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#0b0e14d9;backdrop-filter:blur(14px)}
    h1{font-size:17px;margin:0;letter-spacing:.4px}.live{font-size:12px;color:var(--green);display:flex;gap:8px;align-items:center}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor}
    main{display:grid;grid-template-columns:170px minmax(340px,1fr) minmax(320px,.9fr);height:calc(100vh - 58px);direction:ltr}
    aside,.editor,.preview{min-width:0;border-right:1px solid var(--line);direction:rtl}.label{padding:14px 16px 9px;color:var(--muted);font-size:10px;letter-spacing:1.6px;font-weight:700}
    #files{padding:0 8px}.file{width:100%;border:0;background:transparent;color:#b9c4d6;text-align:left;direction:ltr;padding:10px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file:hover,.file.active{background:#1a2230;color:white}.file.active{box-shadow:inset 2px 0 var(--cyan)}
    .editor{display:flex;flex-direction:column;background:#0d1118}.bar{height:42px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:12px ui-monospace,monospace;color:#bdc8d8;direction:ltr}
    textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#dce7f7;padding:18px 22px;font:14px/1.75 "Cascadia Code","SFMono-Regular",monospace;tab-size:4;direction:ltr;text-align:left}
    .status{min-height:40px;border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted);direction:ltr;text-align:left}.status.busy{color:var(--cyan)}.status.error{color:var(--red);white-space:pre-wrap;max-height:120px;overflow:auto}
    .preview{display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,#111722,#090b10);padding:22px}.preview-top{width:100%;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;direction:ltr}
    .phone{margin:auto;max-width:100%;height:min(72vh,760px);aspect-ratio:9/19.5;border:7px solid #30394a;border-radius:38px;background:#050608;box-shadow:0 28px 80px #000a,0 0 0 1px #5b6882;overflow:hidden;display:flex;align-items:center;justify-content:center}.phone img{width:100%;height:100%;object-fit:contain}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
    @media(max-width:850px){main{grid-template-columns:120px 1fr}.preview{position:fixed;inset:100px 20px 20px 140px;display:none}.preview.show{display:flex}#toggle{display:block}}@media(min-width:851px){#toggle{display:none}}
    button.action{border:1px solid var(--line);background:#151c28;color:white;border-radius:6px;padding:6px 10px;cursor:pointer}
  </style>
</head>
<body>
  <header><h1>Swift Lab</h1><div style="display:flex;gap:14px;align-items:center"><button id="toggle" class="action">Preview</button><span class="live">CONNECTED</span></div></header>
  <main>
    <aside><div class="label" style="display:flex;justify-content:space-between;align-items:center"><span>SWIFT FILES</span><button id="new" class="action" title="New Swift file">＋</button></div><div id="files"></div></aside>
    <section class="editor"><div class="bar"><span id="name">—</span><span>AUTOSAVE · 500ms</span></div><textarea id="code" spellcheck="false"></textarea><div id="status" class="status">Loading…</div></section>
    <section id="preview" class="preview"><div class="preview-top"><span>REAL XCODE PREVIEW</span><span id="speed">—</span></div><div class="phone"><div id="empty" class="empty">اكتب SwiftUI وسيتحدث العرض تلقائيًا</div><img id="image" alt="SwiftUI Preview" hidden></div></section>
  </main>
  <script>
    const base=location.pathname.replace(/\/$/,"");let active="",timer=0,requestId=0;
    const $=id=>document.getElementById(id),code=$("code"),status=$("status"),image=$("image");
    async function api(route,options){const r=await fetch(base+route,options);const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");return data}
    async function loadState(preferred){const state=await api("/api/state");$("files").innerHTML="";for(const name of state.files){const b=document.createElement("button");b.className="file";b.textContent=name;b.onclick=()=>openFile(name);$("files").append(b)}if(state.files.length)await openFile(preferred&&state.files.includes(preferred)?preferred:state.files[0])}
    async function openFile(name){active=name;const f=await api("/api/file?name="+encodeURIComponent(name));code.value=f.content;$("name").textContent=name;document.querySelectorAll(".file").forEach(x=>x.classList.toggle("active",x.textContent===name));status.className="status";status.textContent="Ready"}
    async function render(){if(!active)return;const id=++requestId;status.className="status busy";status.textContent="Rendering…";try{const result=await api("/api/render",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:active,content:code.value})});if(id!==requestId)return;image.src=base+"/preview.png?v="+result.version;image.hidden=false;$("empty").hidden=true;$("speed").textContent=(result.elapsedMs/1000).toFixed(1)+"s";status.className="status";status.textContent="Preview updated"}catch(e){if(id!==requestId)return;status.className="status error";status.textContent=e.message}}
    code.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(render,500)});code.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const s=code.selectionStart;code.setRangeText("    ",s,code.selectionEnd,"end")}});
    $("new").onclick=async()=>{let name=prompt("اسم ملف Swift الجديد:","NewView.swift");if(!name)return;if(!name.endsWith(".swift"))name+=".swift";const type=name.replace(/\.swift$/i,"").replace(/[^A-Za-z0-9_]/g,"")||"NewView";active=name;code.value=`import SwiftUI\n\nstruct ${type}: View {\n    var body: some View {\n        Text("Hello")\n    }\n}\n\n#Preview {\n    ${type}()\n}\n`;await render();await loadState(name)};
    $("toggle").onclick=()=>$("preview").classList.toggle("show");loadState().catch(e=>{status.className="status error";status.textContent=e.message});
  </script>
</body>
</html>
